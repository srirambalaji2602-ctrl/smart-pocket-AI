{% extends "base.html" %}

{% block title %}
Login — PocketSmart AI
{% endblock %}


{% block content %}

<div class="auth-card">

    <span class="eyebrow">
        WELCOME BACK
    </span>

    <h1>
        Log in
    </h1>

    <p class="muted">
        Continue your budget plans.
    </p>


    <form id="loginForm">

        <label>

            Email

            <input
                name="email"
                type="email"
                required
                placeholder="you@example.com"
            >

        </label>


        <label>

            Password

            <input
                name="password"
                type="password"
                required
                placeholder="••••••••"
            >

        </label>


        <button
            class="btn primary full"
            type="submit"
        >
            Login
        </button>

    </form>


    <p
        class="form-msg"
        id="loginMsg"
    ></p>


    <p class="muted">

        New here?

        <a href="/register">
            Create an account
        </a>

    </p>

</div>

{% endblock %}


{% block scripts %}

<script>
bindAuthForm(
    "loginForm",
    "/login",
    "loginMsg"
);
</script>

{% endblock %}
